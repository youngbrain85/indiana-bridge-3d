name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: python test_manager.py
      - run: npm ci
      - run: npm run build
      - run: node --check web/app.js
      - run: node --check web/analysis.js
      - run: node --check web/defects.js
      - run: node --test test_inspection_rules.mjs
      - name: Built bundles are committed and current
        run: git diff --exit-code -- web/viewer.bundle.js web/inspect.bundle.js
  fem-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-fem.txt
      - run: python test_fem.py
      - run: python test_global_fem.py
      - run: python test_fem_service.py
