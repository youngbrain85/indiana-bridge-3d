name: Deploy static viewer to GitHub Pages
on:
  push:
    branches: [codex/initial-release, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and FEM solver
        run: |
          python -m pip install -r requirements.txt
          python -m venv .venv-fem
          .venv-fem/bin/python -m pip install -r requirements.txt -r requirements-fem.txt
      - name: Export static site with precomputed FEM runs
        run: python scripts/build_static_site.py _site --run-fem
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
